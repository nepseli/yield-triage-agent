[project]
name = "yield-triage-agent"
version = "0.1.0"
description = "Proof of concept: MCP server plus LangGraph agent that triages yield excursions in sensor data, with policy controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.43",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "mcp>=2.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.13",
    "pyyaml>=6",
    "scipy>=1.13",
]

[project.scripts]
yield-triage = "yield_triage.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "scipy-stubs",
    "types-pyyaml>=6.0.12.20260906",
    "boto3-stubs[bedrock-runtime]>=1.43.108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yield_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", "eval"]
