# CI: lint, typecheck, tests, smoke, eval, hygiene, and a Docker build with the
# container smoke test. Needs no secrets. Third-party actions are pinned to
# full commit SHAs (tag noted alongside for readability).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.13"
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make smoke
      - run: make eval
      - run: make hygiene

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docker
